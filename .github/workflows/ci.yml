name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Validate Compose configuration
        run: docker compose -f compose.example.yml config --quiet
      - name: Build and start the production container
        run: docker compose -p planscan-ci -f compose.example.yml up --build --detach --wait --wait-timeout 90
        env:
          PLANSCAN_HOST_PORT: "4175"
      - name: Run browser checks against the production container
        run: npm run test:browser
        env:
          PLANSCAN_QA_URL: http://127.0.0.1:4175
      - name: Container logs
        if: always()
        run: docker compose -p planscan-ci -f compose.example.yml logs --no-color
      - name: Stop the production container
        if: always()
        run: docker compose -p planscan-ci -f compose.example.yml down
